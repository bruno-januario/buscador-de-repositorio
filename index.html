        <meta name="keywords" content="buscador, repositorios, repo-searcher, github, githubapi, api, html, css, javascript">

        <meta property="og:type" content="website">

        <meta name="twitter:card" content="summary">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <body>
        <header class="flex">
            <h1>Buscador de Repositório</h1>
            <div class="search-group">
                <input id="search-field" type="text" placeholder="Pesquisar...">
                <button id="search-btn" alt="Buscar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </header>
        
        <main id="search-result">
            <div class="message">Nenhum repositório para exibir.</div>
        </main>

        <footer class="flex">
            <p>Desenvolvido por <span>Bruno Januário</span></p>
            <div class="flex">
                <a href="https://linkedin.com/in/dev-bruno-januario" target="_blank">

                </a>
                <a href="https://github.com/bruno-januario" target="_blank">
                    <i class="fa-brands fa-square-github"></i>
                </a>
            </div>
        </footer>
